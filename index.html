<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090b10" />
  <title>XMAX GUARD</title>
  <style>
    :root {
      --bg-black: #090b10;
      --bg-anthracite: #141821;
      --bg-dark-gray: #1e2430;
      --border-gray: #2b3344;
      --text-main: #f3f6fa;
      --text-muted: #9aa5b8;
      --accent-blue: #2563eb;
      --accent-blue-glow: rgba(37, 99, 235, 0.28);
      --status-safe: #10b981;
      --status-off: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 36px;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Üst Başlık ve Logo Alanı */
    .header {
      background: linear-gradient(145deg, var(--bg-anthracite), var(--bg-black));
      border: 1px solid var(--border-gray);
      border-radius: 22px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1d4ed8, #0f172a);
      border: 1px solid rgba(59, 130, 246, 0.45);
      box-shadow: 0 0 20px var(--accent-blue-glow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .mode-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background-color: var(--bg-dark-gray);
      color: var(--text-muted);
      border: 1px solid var(--border-gray);
    }

    .mode-pill.active {
      background-color: rgba(37, 99, 235, 0.16);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.5);
    }

    /* Güvenlik Durum Kartı */
    .status-card {
      background: var(--bg-anthracite);
      border: 1px solid var(--border-gray);
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--status-safe);
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--status-safe);
    }

    .status-main {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .info-box {
      background-color: var(--bg-dark-gray);
      border: 1px solid var(--border-gray);
      border-radius: 16px;
      padding: 14px;
    }

    .info-box-title {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .info-box-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="header">
      <div class="brand">
        <div class="logo-badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">XMAX GUARD</div>
          <div class="brand-subtitle">Yamaha XMAX 250</div>
        </div>
      </div>
      <div id="headerModeBadge" class="mode-pill">PASİF</div>
    </header>

    <section class="status-card">
      <div class="status-top">
        <span class="status-label">Motosiklet Güvenlik Durumu</span>
        <span class="live-badge"><span class="live-dot"></span>SİSTEM HAZIR</span>
      </div>
      <div id="securityStatusText" class="status-main">Güvenlik Modu Kapalı</div>
      <p id="securityStatusDesc" class="status-desc">
        Motosiklet izleme paneli hazır. Güvenlik modunu sonraki adımda ekleyeceğimiz kontrol butonundan yönetebilirsin.
      </p>

      <div class="info-grid">
        <div class="info-box">
          <div class="info-box-title">GÜVENLİK MODU</div>
          <div id="securityIndicator" class="info-box-value">KAPALI</div>
        </div>
        <div class="info-box">
          <div class="info-box-title">GECE MODU (00:00–08:00)</div>
          <div id="nightIndicator" class="info-box-value">BEKLEMEDE</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
