<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090b10" />
  <title>XMAX GUARD</title>
  <style>
    :root {
      --bg-black: #090b10;
      --bg-anthracite: #141821;
      --bg-dark-gray: #1e2430;
      --border-gray: #2b3344;
      --text-main: #f3f6fa;
      --text-muted: #9aa5b8;
      --accent-blue: #2563eb;
      --accent-blue-hover: #1d4ed8;
      --accent-blue-glow: rgba(37, 99, 235, 0.32);
      --status-safe: #10b981;
      --status-danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px 36px;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Üst Başlık ve Logo Alanı */
    .header {
      background: linear-gradient(145deg, var(--bg-anthracite), var(--bg-black));
      border: 1px solid var(--border-gray);
      border-radius: 22px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1d4ed8, #0f172a);
      border: 1px solid rgba(59, 130, 246, 0.45);
      box-shadow: 0 0 20px var(--accent-blue-glow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .mode-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background-color: var(--bg-dark-gray);
      color: var(--text-muted);
      border: 1px solid var(--border-gray);
      transition: all 0.25s ease;
    }

    .mode-pill.active {
      background-color: rgba(37, 99, 235, 0.2);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.6);
      box-shadow: 0 0 14px var(--accent-blue-glow);
    }

    /* Güvenlik Durum Kartı */
    .status-card {
      background: var(--bg-anthracite);
      border: 1px solid var(--border-gray);
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .status-card.armed {
      border-color: rgba(37, 99, 235, 0.65);
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.14);
    }

    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-dark-gray);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .live-badge.armed {
      color: var(--status-safe);
      background: rgba(16, 185, 129, 0.14);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .live-badge.armed .live-dot {
      background-color: var(--status-safe);
    }

    .status-main {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-desc {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .info-box {
      background-color: var(--bg-dark-gray);
      border: 1px solid var(--border-gray);
      border-radius: 16px;
      padding: 14px;
    }

    .info-box-title {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .info-box-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .info-box-value.blue {
      color: #60a5fa;
    }

    /* Manuel Kontrol Kartı */
    .control-card {
      background: var(--bg-anthracite);
      border: 1px solid var(--border-gray);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-title {
      font-size: 15px;
      font-weight: 700;
    }

    .last-action {
      font-size: 12px;
      color: var(--text-muted);
    }

    .guard-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.12s ease, background-color 0.25s ease, box-shadow 0.25s ease;
      background: linear-gradient(135deg, var(--accent-blue), #1d4ed8);
      color: #ffffff;
      box-shadow: 0 6px 20px var(--accent-blue-glow);
    }

    .guard-btn:active {
      transform: scale(0.98);
    }

    .guard-btn.armed {
      background: var(--bg-dark-gray);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.45);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="header">
      <div class="brand">
        <div class="logo-badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">XMAX GUARD</div>
          <div class="brand-subtitle">Yamaha XMAX 250</div>
        </div>
      </div>
      <div id="headerModeBadge" class="mode-pill">PASİF</div>
    </header>

    <section id="statusCard" class="status-card">
      <div class="status-top">
        <span class="status-label">Motosiklet Güvenlik Durumu</span>
        <span id="liveBadge" class="live-badge"><span class="live-dot"></span><span id="liveBadgeText">DEVRE DIŞI</span></span>
      </div>
      <div id="securityStatusText" class="status-main">Güvenlik Modu Kapalı</div>
      <p id="securityStatusDesc" class="status-desc">
        Motosiklet şu an koruma modunda değil. Park ettiğinde korumayı başlatmak için aşağıdaki butonu kullan.
      </p>

      <div class="info-grid">
        <div class="info-box">
          <div class="info-box-title">GÜVENLİK MODU</div>
          <div id="securityIndicator" class="info-box-value">KAPALI</div>
        </div>
        <div class="info-box">
          <div class="info-box-title">GECE MODU (00:00–08:00)</div>
          <div id="nightIndicator" class="info-box-value">BEKLEMEDE</div>
        </div>
      </div>
    </section>

    <section class="control-card">
      <div class="control-header">
        <span class="control-title">Manuel Güvenlik Kontrolü</span>
        <span id="lastActionTime" class="last-action">Son işlem: --:--</span>
      </div>
      <button id="toggleGuardBtn" class="guard-btn" type="button">
        <svg id="btnIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span id="btnText">Güvenlik Modunu Aç</span>
      </button>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "xmax_guard_manual_armed";
    const TIME_KEY = "xmax_guard_last_action";

    const headerModeBadge = document.getElementById("headerModeBadge");
    const statusCard = document.getElementById("statusCard");
    const liveBadge = document.getElementById("liveBadge");
    const liveBadgeText = document.getElementById("liveBadgeText");
    const securityStatusText = document.getElementById("securityStatusText");
    const securityStatusDesc = document.getElementById("securityStatusDesc");
    const securityIndicator = document.getElementById("securityIndicator");
    const lastActionTime = document.getElementById("lastActionTime");
    const toggleGuardBtn = document.getElementById("toggleGuardBtn");
    const btnText = document.getElementById("btnText");

    let isArmed = localStorage.getItem(STORAGE_KEY) === "true";
    let savedTime = localStorage.getItem(TIME_KEY) || "--:--";

    function formatCurrentTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      return `${hours}:${minutes}`;
    }

    function renderUI() {
      lastActionTime.textContent = `Son işlem: ${savedTime}`;

      if (isArmed) {
        headerModeBadge.textContent = "AKTİF";
        headerModeBadge.classList.add("active");
        statusCard.classList.add("armed");
        liveBadge.classList.add("armed");
        liveBadgeText.textContent = "KORUMA AKTİF";
        securityStatusText.textContent = "Motosiklet Koruma Altında";
        securityStatusDesc.textContent = "Manuel güvenlik modu devrede. Yamaha XMAX 250 izleme ve güvenlik durumu aktif olarak takip ediliyor.";
        securityIndicator.textContent = "AÇIK";
        securityIndicator.classList.add("blue");
        toggleGuardBtn.classList.add("armed");
        btnText.textContent = "Güvenlik Modunu Kapat";
      } else {
        headerModeBadge.textContent = "PASİF";
        headerModeBadge.classList.remove("active");
        statusCard.classList.remove("armed");
        liveBadge.classList.remove("armed");
        liveBadgeText.textContent = "DEVRE DIŞI";
        securityStatusText.textContent = "Güvenlik Modu Kapalı";
        securityStatusDesc.textContent = "Motosiklet şu an koruma modunda değil. Park ettiğinde korumayı başlatmak için aşağıdaki butonu kullan.";
        securityIndicator.textContent = "KAPALI";
        securityIndicator.classList.remove("blue");
        toggleGuardBtn.classList.remove("armed");
        btnText.textContent = "Güvenlik Modunu Aç";
      }
    }

    toggleGuardBtn.addEventListener("click", () => {
      isArmed = !isArmed;
      savedTime = formatCurrentTime();
      localStorage.setItem(STORAGE_KEY, String(isArmed));
      localStorage.setItem(TIME_KEY, savedTime);
      renderUI();
    });

    renderUI();
  </script>
</body>
</html>
